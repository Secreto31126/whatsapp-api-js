# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://help.github.com/actions/language-and-framework-guides/publishing-nodejs-packages

name: Deploy to NPM

on:
    release:
        types: [created]

jobs:
    build:
        name: Build and Document
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/setup@v3

            - name: Build
              run: pnpm build

            - name: Store builds
              uses: actions/upload-artifact@v7
              with:
                  name: build
                  path: lib

    test:
        name: Test
        needs: build

        runs-on: ubuntu-latest
        strategy:
            matrix:
                runtime: [node@22, node@24, node@26]

        steps:
            - uses: actions/checkout@v7
            - uses: actions/download-artifact@v8
              with:
                  name: build
                  path: lib
            - name: Use ${{ matrix.runtime }}
              uses: pnpm/setup@v3
              with:
                  cache: true
                  runtime: ${{ matrix.runtime }}

            - name: Test
              run: pnpm test

    publish-npm:
        name: Public Release
        needs: test

        runs-on: ubuntu-latest
        permissions:
            id-token: write

        if: ${{ !github.event.release.prerelease }}

        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/setup@v3
              with:
                  cache: true
            - uses: actions/download-artifact@v8
              with:
                  name: build
                  path: lib

            - name: Give me 1 minute to reconsider my life actions
              run: sleep 60s

            - name: Ok, now publish it
              run: pnpm publish --provenance --no-git-checks

    preview-npm:
        name: Beta Release
        needs: test

        runs-on: ubuntu-latest
        permissions:
            id-token: write

        if: ${{ github.event.release.prerelease }}

        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/setup@v3
              with:
                  cache: true
            - uses: actions/download-artifact@v8
              with:
                  name: build
                  path: lib

            - name: Set package version to prerelease tag
              run: pnpm version --no-git-tag-version ${GITHUB_REF/refs\/tags\//}

            - name: Beta Release
              run: pnpm publish --provenance --tag beta --no-git-checks

    web-release:
        name: Deploy website
        needs: publish-npm

        uses: ./.github/workflows/web-release.yml
        secrets: inherit
        with:
            tag_name: ${{ github.event.release.tag_name }}
